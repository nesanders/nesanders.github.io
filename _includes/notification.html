<!--
  NES override of Chirpy's PWA "update available" toast.
  Goal: apply new content automatically instead of prompting the user.

  Chirpy's app.min.js registers the service worker and, on an update, shows this
  #notification toast; only a click on its button posts SKIP_WAITING (which
  activates the new worker and triggers a controllerchange -> auto reload).

  We keep the toast element (hidden) because app.min.js queries
  `#notification` and `.toast-body > button` DURING registration — removing them
  throws and breaks the service worker entirely (no offline cache, no updates).
  The script below posts SKIP_WAITING itself as soon as an update is waiting, so
  the update applies and the page reloads without any dialog.
-->

<style>
  #notification {
    display: none !important;
  }
</style>

<aside
  id="notification"
  class="toast"
  role="alert"
  aria-live="assertive"
  aria-atomic="true"
  data-bs-animation="false"
  data-bs-autohide="false"
>
  <div class="toast-body text-center pt-0">
    <button type="button" class="btn btn-primary d-none" aria-label="Update">
      Update
    </button>
  </div>
</aside>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.ready.then(function (reg) {
      var activate = function () {
        // Only for genuine updates (a controller already exists), not first install.
        if (reg.waiting && navigator.serviceWorker.controller) {
          reg.waiting.postMessage('SKIP_WAITING');
        }
      };
      activate(); // an update that was already waiting from a previous visit
      reg.addEventListener('updatefound', function () {
        var installing = reg.installing;
        if (installing) {
          installing.addEventListener('statechange', activate);
        }
      });
    });
    // Reload is handled by Chirpy's own `controllerchange` listener.
  }
</script>
